<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion De Stock</title>
    <meta name="theme-color" content="#faf6ef">
    <meta name="description" content="Organizá el inventario de tu emprendimiento de forma fácil y rápida. Controlá tus productos, gestioná tu stock y mantené todo bajo control desde un solo lugar.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- "nest": Font Awesome deja el <i> en su lugar y pone el SVG adentro, así React puede quitarlo sin errores -->
    <script>
      // Aplica el tema antes de pintar para evitar un destello claro
      (function () {
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m && t === "dark") m.setAttribute("content", "#1c1713");
      })();
    </script>
    <script src="https://kit.fontawesome.com/0609dfb132.js" crossorigin="anonymous" data-auto-replace-svg="nest"></script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
